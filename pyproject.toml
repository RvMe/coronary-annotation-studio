[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coronary-annotation-studio"
version = "0.1.0"
description = "Offline coronary CPR interval annotation, review and reliable export"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = ["PySide6==6.9.3", "SimpleITK==2.5.2", "numpy==2.2.6", "scipy==1.15.3", "pynrrd==1.1.3"]

[project.scripts]
coronary-annotation-studio = "annotation_app.cli:main"

[tool.setuptools.packages.find]
include = ["annotation_app*"]

[tool.setuptools.package-data]
annotation_app = ["translations/*", "resources/*"]
