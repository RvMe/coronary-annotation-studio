site_name: Coronary Annotation Studio
site_url: https://rvme.github.io/coronary-annotation-studio/
repo_url: https://github.com/RvMe/coronary-annotation-studio
repo_name: GitHub
edit_uri: edit/main/docs/
site_description: Offline coronary CPR interval annotation and reliable export
docs_dir: docs
site_dir: site
theme:
  name: mkdocs
  locale: en
nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Quick start: quickstart.md
  - Data:
      - Data format: data-format.md
      - Slicer adapter: slicer.md
      - Legacy import: legacy.md
  - Reference:
      - Build and verify: build.md
      - Troubleshooting: troubleshooting.md
      - Limitations: limitations.md
      - Release evidence: acceptance.md
  - 简体中文:
      - 概览: zh/index.md
      - 安装与使用: zh/quickstart.md
      - 数据格式与 Slicer: zh/data-format.md
      - 旧版导入与故障排查: zh/troubleshooting.md
      - 验收记录: zh/acceptance.md
markdown_extensions:
  - tables
extra_css:
  - stylesheets/studio.css
